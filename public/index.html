<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de independencia · GreenPipe demo</title>
  <style>
    :root { --ink: #10382b; --muted: #5b7168; --line: #cfdcd3; --bg: #f2f6f1; --green: #1c8f4e; --red: #b3371f; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    main { max-width: 26rem; margin: 0 auto; padding: 3rem 1.25rem; }
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .4rem; }
    p.lead { margin: 0 0 1.75rem; color: var(--muted); }
    section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1.5rem; }
    h2 { font-size: 1.05rem; margin: 0 0 1rem; }
    label { display: block; font-size: .9rem; font-weight: 600; margin-bottom: .9rem; }
    input { display: block; width: 100%; margin-top: .3rem; padding: .6rem .7rem; font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #8fd1a9; outline-offset: 2px; }
    button { width: 100%; padding: .7rem 1rem; font: inherit; font-weight: 600; color: #fff; background: var(--green); border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: #167a42; }
    .error { color: var(--red); font-weight: 600; margin: .9rem 0 0; min-height: 1.5em; }
    .result { margin: 1rem 0 0; font-weight: 600; min-height: 3em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>¿Ya puedes vivir de tus facturas?</h1>
    <p class="lead">Introduce tus horas, tu tarifa y tus gastos del mes.</p>

    <section id="login-section" aria-labelledby="login-title">
      <h2 id="login-title">Inicia sesión</h2>
      <form id="login-form" novalidate>
        <label>Email
          <input type="email" data-testid="email" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input type="password" data-testid="password" autocomplete="current-password" required>
        </label>
        <button type="submit" data-testid="login-btn">Iniciar sesión</button>
        <p class="error" data-testid="login-error" role="alert"></p>
      </form>
    </section>

    <section id="calc-section" aria-labelledby="calc-title" hidden>
      <h2 id="calc-title">Calculadora</h2>
      <form id="calc-form" novalidate>
        <label>Horas facturadas
          <input type="number" min="0" step="any" data-testid="hours" required>
        </label>
        <label>Tarifa por hora
          <input type="number" min="0" step="any" data-testid="rate" required>
        </label>
        <label>Gastos del mes
          <input type="number" min="0" step="any" data-testid="expenses" required>
        </label>
        <button type="submit" data-testid="calc-btn">Calcular</button>
        <p class="result" data-testid="result" role="status"></p>
      </form>
    </section>
  </main>

  <script>
    const $ = (id) => document.querySelector(`[data-testid="${id}"]`);

    async function post(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body),
      });
      return { status: res.status, data: await res.json().catch(() => ({})) };
    }

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('login-error').textContent = '';
      const { status } = await post('/api/login', {
        email: $('email').value.trim(),
        password: $('password').value,
      });
      if (status === 200) {
        document.getElementById('login-section').hidden = true;
        document.getElementById('calc-section').hidden = false;
        $('hours').focus();
      } else {
        $('login-error').textContent = 'Credenciales inválidas';
      }
    });

    document.getElementById('calc-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const toNumber = (id) => ($(id).value === '' ? NaN : Number($(id).value));
      const { status, data } = await post('/api/calculate', {
        hours: toNumber('hours'),
        rate: toNumber('rate'),
        expenses: toNumber('expenses'),
      });
      if (status === 200) {
        const base = `Facturas ${data.gross} y te quedan ${data.net}.`;
        $('result').textContent = data.independent
          ? `${base} ¡Eres independiente!`
          : `${base} Necesitas al menos ${data.needed}.`;
      } else if (status === 401) {
        $('result').textContent = 'Tu sesión caducó. Recarga la página e inicia sesión de nuevo.';
      } else {
        $('result').textContent = 'Revisa los valores: deben ser números mayores o iguales a 0.';
      }
    });
  </script>
</body>
</html>
