name: Tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests
        id: tests
        continue-on-error: true
        run: npx playwright test

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Analizar fallos con IA
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx tsx scripts/analyze-failures.ts

      - name: Marcar el check como fallido si hubo tests rotos
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Hay tests fallidos. Revisa el comentario de IA y el artifact playwright-report."
          exit 1
